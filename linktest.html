<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Klangfeed Link-Test 3</title>
<style>
body{font:17px -apple-system,system-ui,sans-serif;background:#111;color:#eee;padding:calc(env(safe-area-inset-top) + 16px) 20px 40px;max-width:480px;margin:auto}
a,button{display:block;width:100%;box-sizing:border-box;text-align:left;margin:12px 0;padding:15px 16px;border:0;border-radius:14px;background:#2a2340;color:#fff;text-decoration:none;font:600 17px -apple-system,system-ui,sans-serif}
small{display:block;font-weight:400;opacity:.6;margin-top:3px}
.back{background:#333;text-align:center} .play{background:#1d5c3a}
</style></head><body>
<a class="back" href="./">‹ Zurück zu Klangfeed</a>
<h2>Test 3: Liegt es an der laufenden Musik?</h2>
<p>Vor <b>jedem</b> Buchstaben zuerst auf ▶︎ tippen, bis Musik läuft. Dann den Buchstaben antippen. Welche Buchstaben öffnen „Champagne Coast“ von Blood Orange?</p>
<button class="play" id="play">▶︎ Musik starten</button>
<button data-k="x">X<small>Musik läuft weiter</small></button>
<button data-k="y">Y<small>Musik vorher pausieren</small></button>
<button data-k="z">Z<small>Musik vorher ganz beenden</small></button>
<button data-k="w">W<small>Musik ganz beenden, kurz warten</small></button>
<script>
const u = 'music://music.apple.com/de/album/champagne-coast/444588060?i=444588093';
const a = new Audio('https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/c6/db/56/c6db5666-4464-a6e5-d6e8-8d481b926e70/mzaf_17727462257578713488.plus.aac.p.m4a');
const ms = () => { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Smooth Operator', artist: 'Sade', album: 'Klangfeed-Test' }); };
const kill = () => { a.pause(); a.removeAttribute('src'); a.load(); if ('mediaSession' in navigator) { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = 'none'; } };
document.getElementById('play').onclick = () => { if (!a.getAttribute('src')) a.src = 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/c6/db/56/c6db5666-4464-a6e5-d6e8-8d481b926e70/mzaf_17727462257578713488.plus.aac.p.m4a'; a.currentTime = 0; a.play(); ms(); };
document.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'x') location.href = u;
  if (k === 'y') { a.pause(); location.href = u; }
  if (k === 'z') { kill(); location.href = u; }
  if (k === 'w') { kill(); setTimeout(() => { location.href = u; }, 400); }
});
</script>
</body></html>
